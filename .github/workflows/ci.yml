name: CI

on:
  # EVERY pull request, not only those targeting main.
  #
  # This said `branches: [main]`, so a PR stacked on a feature branch got NO
  # CI RUN AT ALL — not a failure, not a skip, simply no `validate` check to
  # look at. PR #61 (the map layer endpoints, stacked on #53) sat with Vercel
  # green and nothing else, and the only thing that had actually run its
  # typecheck, tests and guards was .githooks/pre-push on one laptop.
  #
  # That is the same shape as the drift run-guards.mjs was written to end:
  # checks written, committed and believed to be enforced, enforced in fact by
  # a local hook that a fresh clone does not have until `npm run prepare`.
  # Stacked work is exactly where review attention is thinnest, so it is the
  # worst place to have no CI.
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Secret scan
        run: bash scripts/scan-secrets.sh --all

      # DERIVED, not enumerated. This step used to name check:llm-spend and
      # check:collectors, and that list went stale without anyone noticing:
      # check:cron-auth and check:style-attr were written, committed and
      # believed to be enforced while running in NO CI job at all. The
      # pre-push hook derived its list and so kept catching them, which is
      # exactly why the gap stayed invisible.
      #
      # `npm run guards` reads the check:* scripts out of package.json, so a
      # guard added tomorrow runs here the moment it is defined. It refuses to
      # report success if the list comes back empty.
      - name: Guards (all check:* derived from package.json)
        run: npm run guards

      - name: Build
        run: npm run build
